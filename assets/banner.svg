<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; opacity: 0.35; }
    .pulse-orb-1 {
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .pulse-orb-2 {
      animation: floatOrb2 10s ease-in-out infinite alternate;
    }
    .pulse-orb-3 {
      animation: floatOrb3 12s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashFlow 25s linear infinite;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }

    @keyframes dashFlow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatOrb {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1.1); }
      100% { transform: translate(-35px, 30px) scale(0.95); }
    }
    @keyframes floatOrb3 {
      0% { transform: translate(0px, 0px) scale(0.9); }
      100% { transform: translate(25px, 20px) scale(1.1); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1280" height="440" fill="url(#bgGradient)" />

  <!-- Animated Glowing Ambience (Strictly in Background) -->
  <g opacity="0.35">
    <circle class="pulse-orb-1" cx="220" cy="110" r="160" fill="#38bdf8" filter="url(#glow)" />
    <circle class="pulse-orb-2" cx="1060" cy="140" r="190" fill="#818cf8" filter="url(#glow)" />
    <circle class="pulse-orb-3" cx="640" cy="380" r="140" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Technical Circuit Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="160" y1="0" x2="160" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="640" y1="0" x2="640" y2="440" />
    <line x1="800" y1="0" x2="800" y2="440" />
    <line x1="960" y1="0" x2="960" y2="440" />
    <line x1="1120" y1="0" x2="1120" y2="440" />
  </g>

  <!-- Dynamic Animated Cybernetic Flows -->
  <path d="M 0 160 Q 320 280 640 160 T 1280 160" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="flow-line" />
  <path d="M 0 320 Q 320 200 640 320 T 1280 320" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="flow-line" style="animation-direction: reverse;" />

  <!-- Dynamic Floating Feature Pills -->
  <g transform="translate(640, 290)">
    <!-- Pill 1: AI Contract Review -->
    <g transform="translate(-480, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="21" cy="21" r="6" fill="#38bdf8" filter="url(#glow-subtle)" />
      <text x="38" y="26" class="badge-pill">⚖️ AI Contract Review</text>
    </g>

    <!-- Pill 2: Automated Redlining -->
    <g transform="translate(-230, 0)">
      <rect x="0" y="0" width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="21" cy="21" r="6" fill="#818cf8" filter="url(#glow-subtle)" />
      <text x="38" y="26" class="badge-pill">🔍 Automated Redlining</text>
    </g>

    <!-- Pill 3: Enterprise CLM -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <circle cx="21" cy="21" r="6" fill="#a855f7" filter="url(#glow-subtle)" />
      <text x="38" y="26" class="badge-pill">📑 Enterprise CLM</text>
    </g>

    <!-- Pill 4: Open-Source Models -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="240" height="42" rx="21" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
      <circle cx="21" cy="21" r="6" fill="#ec4899" filter="url(#glow-subtle)" />
      <text x="38" y="26" class="badge-pill">🔓 Open-Source &amp; Models</text>
    </g>
  </g>

  <!-- Status / Ecosystem Metrics Ribbon -->
  <g transform="translate(640, 360)">
    <rect x="-300" y="0" width="600" height="34" rx="17" fill="#0b1329" stroke="#334155" stroke-width="1" opacity="0.95" />
    <circle cx="-275" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
      Curated Commercial SaaS Platforms &amp; Top Open-Source Legal Tech Engines
    </text>
  </g>

  <!-- FOREGROUND HERO HEADER & SUBTITLE (Guaranteed on top) -->
  <g id="hero-foreground">
    <!-- Category Tag -->
    <rect x="520" y="55" width="240" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="640" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.1em">LEGAL TECH &amp; CONTRACT AI</text>

    <!-- Main Title -->
    <text x="640" y="145" text-anchor="middle" class="title-text" font-size="46" fill="url(#accentGrad)" filter="url(#glow-subtle)">
      Awesome Legal Tech AI &amp; Contract Review
    </text>

    <!-- Subtitle -->
    <text x="640" y="195" text-anchor="middle" class="subtitle-text" font-size="18">
      Curated Directory of AI Legal Copilots, CLM Platforms, Clause Parsers &amp; Open-Source Engines
    </text>
  </g>
</svg>